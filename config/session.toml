# Default configuration for mitos-session.
# Installed at /etc/mitos/session.toml; every key here is optional --
# anything omitted falls back to the compiled-in default in
# src/config/defaults.rs.

[session]
runtime_dir = "/run/mitos-session"
max_sessions_per_user = 4
default_session_type = "wayland"
compositor_binary = "/usr/bin/mitos-gui"
max_compositor_restarts = 3

[seat]
default_seat = "seat0"

[lock]
enabled = true
lock_on_idle = true
lock_on_suspend = true
grace_period_secs = 5
max_auth_attempts = 3
lockout_secs = 30

[idle]
dim_after_secs = 60
lock_after_secs = 300
suspend_after_secs = 600

[authentication]
pam_service = "mitos-session"
allow_empty_password = false

[elevation]
enabled = true
# The account mitos-service (the permission-policy daemon that owns
# the rulebook) runs as. Only this account, or root, may open an
# elevation prompt -- NOT mitos-services (plural), the process
# supervisor; see src/config/settings.rs for why that distinction
# matters here.
service_user = "mitos-service"
pam_service = "mitos-elevate"
allow_empty_password = false
max_attempts = 3
lockout_secs = 30
prompt_timeout_secs = 120
max_pending_per_session = 3

[power]
allow_suspend = true
allow_reboot = true
allow_poweroff = true
suspend_inhibit_grace_secs = 2
# "mitos_power" asks mitos-power to perform the actual suspend/reboot/
# poweroff over its own IPC socket instead of mitos-session touching the
# kernel itself -- the default, and the right choice whenever mitos-power
# is running (see src/power/mod.rs and src/power/mitos_power.rs).
# "direct" calls the kernel itself -- for a mitos-power-less boot.
# "supervised" asks mitos-init to relay to mitos-services first, so
# managed services stop in dependency order first; mitos-power's own
# [shutdown] backend in power.toml offers this same choice now that it's
# the one performing the transition under the default above.
backend = "mitos_power"
# Only read when backend = "mitos_power".
mitos_power_socket_path = "/run/mitos/power.sock"

[ipc]
socket_path = "/run/mitos-session/session.sock"
socket_mode = 0o660

[logging]
level = "info"
json = false
audit_log_path = "/var/log/mitos/session-audit.log"
