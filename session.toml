# Default configuration for mitos-session.
# Installed at /etc/mitos/session.toml; every key here is optional --
# anything omitted falls back to the compiled-in default in
# src/config/defaults.rs.

[session]
runtime_dir = "/run/mitos-session"
max_sessions_per_user = 4
default_session_type = "wayland"
compositor_binary = "/usr/bin/mitos-gui"

[seat]
default_seat = "seat0"

[lock]
enabled = true
lock_on_idle = true
lock_on_suspend = true
grace_period_secs = 5
max_auth_attempts = 3
lockout_secs = 30

[idle]
dim_after_secs = 60
lock_after_secs = 300
suspend_after_secs = 600

[authentication]
pam_service = "mitos-session"
allow_empty_password = false

[power]
allow_suspend = true
allow_reboot = true
allow_poweroff = true
suspend_inhibit_grace_secs = 2

[ipc]
socket_path = "/run/mitos-session/session.sock"
socket_mode = 0o660

[logging]
level = "info"
json = false
audit_log_path = "/var/log/mitos/session-audit.log"
