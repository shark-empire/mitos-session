[package]
name = "mitos-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MITOS Project"]
license = "MIT"
description = "Session, seat, lock, idle, and power manager for the MITOS operating system"

[lib]
name = "mitos_session"
path = "src/lib.rs"

[[bin]]
name = "mitos-session"
path = "src/main.rs"

[[bin]]
name = "mitos-sessionctl"
path = "bin/mitos-sessionctl.rs"

[dependencies]
# Same event-loop crate mitos-gui's Smithay compositor is built on.
# Sharing it means one lightweight, non-async-runtime execution model
# across MITOS's userspace daemons instead of pulling tokio into a
# second process tree just for this one.
calloop = "0.13"

# Thin safe wrappers over the POSIX bits we need: signals, passwd/group
# lookups, uid/gid handling, socket peer credentials, reboot(2).
nix = { version = "0.29", features = [
    "signal", "user", "process", "fs", "socket", "poll", "reboot", "hostname",
] }

serde = { version = "1", features = ["derive"] }
# Compact binary framing for the IPC protocol. Smaller and faster to
# (de)serialize than JSON, which matters here because activity/idle
# reports ride this channel on every keystroke.
bincode = "1.3"
# JSON only for the audit log (logins, lock/unlock, power events) --
# infrequent enough that human-/log-shipper-readable lines are worth
# more than the extra dependency costs here. Never used on the IPC path.
serde_json = "1"
# Human-edited on-disk config only -- never on the IPC hot path.
toml = "0.8"

thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Linux-PAM bindings, used to authenticate unlock attempts against the
# system's real account database instead of reimplementing password
# checking.
pam = "0.8"

clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"   # a bad request handler should not be able to take the whole daemon down
