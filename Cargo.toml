[package]
name = "mitos-session"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MITOS Project"]
license = "MIT"
description = "Session, seat, lock, idle, and power manager for the MITOS operating system"

[lib]
name = "mitos_session"
path = "src/lib.rs"

[[bin]]
name = "mitos-session"
path = "src/main.rs"

[[bin]]
name = "mitos-sessionctl"
path = "bin/mitos-sessionctl.rs"

[dependencies]

sd-notify = "0.4"

# Same event-loop crate mitos-gui's Smithay compositor is built on.
# Sharing it means one lightweight, non-async-runtime execution model
# across MITOS's userspace daemons instead of pulling tokio into a
# second process tree just for this one. There is deliberately no async
# runtime in this crate: nothing here is async, and one would only add
# build time and resident memory.
calloop = { version = "0.12", features = ["signals"] }


# Thin safe wrappers over the POSIX bits we need: signals, passwd/group
# lookups, uid/gid handling, socket peer credentials, reboot(2).
nix = { version = "0.29", features = [
    "signal", "user", "process", "fs", "socket", "poll", "reboot", "hostname",
] }

# `sync(2)` before a direct reboot/poweroff (see power::DirectBackend).
# Already part of the build as a dependency of nix.
libc = "0.2"

serde = { version = "1", features = ["derive"] }
# Compact binary framing for the IPC protocol. Smaller and faster to
# (de)serialize than JSON, which matters here because activity/idle
# reports ride this channel on every keystroke.
bincode = "1.3"
# JSON only for the audit log (logins, lock/unlock, power events) --
# infrequent enough that human-/log-shipper-readable lines are worth
# more than the extra dependency costs here. Never used on the IPC path.
serde_json = "1"
# Human-edited on-disk config only -- never on the IPC hot path.
toml = "0.8"

thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Linux-PAM bindings, used to authenticate unlock attempts against the
# system's real account database instead of reimplementing password
# checking.
pam = "0.8"

clap = { version = "4", features = ["derive"] }
# Real device enumeration for seat::device (input + DRM nodes), instead
# of the metadata-only stub this started as. Static enumeration only --
# hotplug monitoring would need a udev::MonitorSocket wired into
# calloop as a raw-fd source, which is a bigger, riskier change than
# fit in this pass; see docs/architecture.md's "Known gaps".
udev = "0.8"

[dev-dependencies]
tempfile = "3"

# Tuned for a small resident footprint: this daemon is idle almost all of
# the time, so a smaller, faster-to-load binary matters far more than peak
# throughput.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Unwind, not abort: each IPC connection runs on its own thread, and a
# panic in one connection's handler should end only that connection,
# not take the whole daemon (and every session it supervises) with it.
panic = "unwind"
